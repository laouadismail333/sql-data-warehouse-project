
# Workflow name displayed in the GitHub Actions tab
name: SQLServer-DW-ETL-CI

# Run the pipeline when code is pushed or a pull request targets main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Grant only the permissions required to read the repository
permissions:
  contents: read

jobs:
  test-etl-pipeline:
    # Use Ubuntu 22.04 for a consistent CI environment
    runs-on: ubuntu-22.04

    # Start a temporary SQL Server instance for integration tests
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      # Step 1: Download the repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install sqlcmd and its dependencies
      - name: Install SQL Server command-line tools
        run: |
          set -euo pipefail

          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor \
              -o /usr/share/keyrings/microsoft-prod.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            mssql-tools18 unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      # Step 3: Validate that the required SQL scripts exist
      - name: Validate project files
        run: |
          set -euo pipefail

          required_files=(
            "scripts/init_database.sql"
            "scripts/bronze/create_bronze_table.sql"
            "scripts/bronze/load_bronze_procedure.sql"
            "scripts/silver/create_silver_table.sql"
            "scripts/silver/load_silver_procedure.sql"
            "scripts/gold/ddl_gold.sql"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file not found: $file"
              exit 1
            fi

            echo "Found: $file"
          done

      # Step 4: Wait until SQL Server is ready to accept connections
      - name: Wait for SQL Server
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if sqlcmd -S localhost,1433 -U sa -C \
              -Q "SELECT 1" -b -l 5; then
              echo "SQL Server is ready."
              exit 0
            fi


            echo "Waiting for SQL Server ($i/30)..."
            sleep 5
          done

          echo "::error::SQL Server failed to start."
          exit 1

      # Step 5: Copy source CSV files into the SQL Server container
      # Required because BULK INSERT reads files from the SQL Server host
      - name: Prepare source datasets
        run: |
          set -euo pipefail

          if [[ ! -d "datasets/source_crm" ||
                ! -d "datasets/source_erp" ]]; then
            echo "::error::Expected datasets/source_crm and datasets/source_erp."
            exit 1
          fi

          SQL_CONTAINER=$(docker ps \
            --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" \
            --format '{{.ID}}' | head -n 1)

          if [[ -z "$SQL_CONTAINER" ]]; then
            echo "::error::SQL Server container not found."
            exit 1
          fi

          echo "SQL_CONTAINER=$SQL_CONTAINER" >> "$GITHUB_ENV"

          docker exec "$SQL_CONTAINER" mkdir -p /tmp/datasets
          docker cp datasets/. "$SQL_CONTAINER":/tmp/datasets/

          echo "Source datasets copied into SQL Server container."

      # Step 6: Create the database and Bronze, Silver, Gold schemas
      - name: Initialize DataWarehouse
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -i database/01_init_database.sql

      # Step 7: Create raw Bronze staging tables
      - name: Create Bronze tables
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i database/02_bronze_tables.sql

      # Step 8: Create Silver tables
      - name: Create Silver tables
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i database/04_silver_tables.sql

      # Step 9: Create and execute the Bronze loading procedure
      - name: Load Bronze layer
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i database/03_bronze_load.sql

      # Step 10: Execute transformations from Bronze to Silver
      - name: Load Silver layer
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -Q "EXEC silver.load_silver;" 

      # Step 11: Create analytical Gold views
      - name: Create Gold views
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i database/06_gold_views.sql

      # Step 12: Run data quality assertions
      - name: Run data quality tests
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i tests/data_quality_tests.sql

      # Step 13: Display a final success message
      - name: Pipeline summary
        if: success()
        run: |
          echo "SQL Server Data Warehouse CI pipeline completed successfully."
          echo "Database: DataWarehouse"
          echo "Layers: Bronze -> Silver -> Gold"
