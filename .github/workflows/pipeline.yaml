
name: SQLServer-DW-ETL-CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-etl-pipeline:
    # Use Ubuntu 22.04 to match the Microsoft package repository below.
    runs-on: ubuntu-22.04

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SQL Server command-line tools
        run: |
          set -e

          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor \
              -o /usr/share/keyrings/microsoft-prod.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            mssql-tools18 unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -e

          for i in {1..30}; do
            if sqlcmd -S localhost,1433 -U sa -C \
              -Q "SELECT 1" -b; then
              echo "SQL Server is ready."
              exit 0
            fi

            echo "Waiting for SQL Server ($i/30)..."
            sleep 5
          done

          echo "SQL Server failed to start."
          exit 1

      - name: Create DataWarehouse database
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          sqlcmd -S localhost,1433 -U sa -C -b \
            -Q "IF DB_ID('DataWarehouse') IS NULL
                CREATE DATABASE DataWarehouse;"

      - name: Create schema and tables
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i database/schema.sql

      - name: Execute ETL stored procedures
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i database/etl_load.sql

      - name: Run data quality tests
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i tests/data_quality_tests.sql
