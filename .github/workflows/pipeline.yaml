name: SQLServer-DW-ETL-CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-etl-pipeline:
    runs-on: ubuntu-22.04

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install SQL Server command-line tools
      - name: Install SQL Server tools
        run: |
          set -euo pipefail

          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor \
              -o /usr/share/keyrings/microsoft-prod.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            mssql-tools18 unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      # 3. Validate repository files
      - name: Validate project files
        run: |
          set -euo pipefail

          required_files=(
            "scripts/init_database.sql"
            "scripts/bronze/create_bronze_table.sql"
            "scripts/bronze/load_bronze_procedure.sql"
            "scripts/silver/create_silver_table.sql"
            "scripts/silver/load_silver_procedure.sql"
            "scripts/gold/ddl_gold.sql"
            "tests/quality_checks_gold.sql"
            "tests/quality_checks_silver.sql"
            "Datasets/source_crm/cust_info.csv"
            "Datasets/source_crm/prd_info.csv"
            "Datasets/source_crm/sales_details.csv"
            "Datasets/source_erp/CUST_AZ12.csv"
            "Datasets/source_erp/LOC_A101.csv"
            "Datasets/source_erp/PX_CAT_G1V2.csv"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file not found: $file"
              exit 1
            fi

            echo "Found: $file"
          done

      # 4. Wait for SQL Server
      - name: Wait for SQL Server
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if sqlcmd -S localhost,1433 -U sa -C \
              -Q "SELECT 1" -b -l 5; then
              echo "SQL Server is ready."
              exit 0
            fi

            echo "Waiting for SQL Server ($i/30)..."
            sleep 5
          done

          echo "::error::SQL Server failed to start."
          exit 1

      # 5. Copy datasets into SQL Server container
      - name: Prepare source datasets
        run: |
          set -euo pipefail

          SQL_CONTAINER=$(docker ps \
            --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" \
            --format '{{.ID}}' | head -n 1)

          if [[ -z "$SQL_CONTAINER" ]]; then
            echo "::error::SQL Server container not found."
            exit 1
          fi

          echo "SQL_CONTAINER=$SQL_CONTAINER" >> "$GITHUB_ENV"

          docker exec "$SQL_CONTAINER" \
            mkdir -p /tmp/datasets/source_crm /tmp/datasets/source_erp

          docker cp Datasets/source_crm/. \
            "$SQL_CONTAINER":/tmp/datasets/source_crm/

          docker cp Datasets/source_erp/. \
            "$SQL_CONTAINER":/tmp/datasets/source_erp/

          docker exec "$SQL_CONTAINER" \
            ls -la /tmp/datasets/source_crm

          docker exec "$SQL_CONTAINER" \
            ls -la /tmp/datasets/source_erp

          docker exec "$SQL_CONTAINER" \
            test -f /tmp/datasets/source_crm/cust_info.csv

          echo "Datasets copied successfully."

      # 6. Initialize database
      - name: Initialize DataWarehouse
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -i scripts/init_database.sql

      # 7. Create Bronze tables
      - name: Create Bronze tables
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i scripts/bronze/create_bronze_table.sql

      # 8. Create Silver tables
      - name: Create Silver tables
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i scripts/silver/create_silver_table.sql

      # 9. Create Bronze loading procedure
      - name: Create Bronze loading procedure
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i scripts/bronze/load_bronze_procedure.sql

      # 10. Execute Bronze ETL
      - name: Load Bronze layer
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -Q "EXEC bronze.load_bronze;"

      # 11. Create Silver loading procedure
      - name: Create Silver loading procedure
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i scripts/silver/load_silver_procedure.sql

      # 12. Execute Silver ETL
      - name: Load Silver layer
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -Q "EXEC silver.load_silver;"

      # 13. Create Gold views
      - name: Create Gold views
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i scripts/gold/ddl_gold.sql

      # 14. Run Silver quality checks
      - name: Test Silver layer
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i tests/quality_checks_silver.sql

      # 15. Run Gold quality checks
      - name: Test Gold layer
        env:
          SQLCMDPASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          sqlcmd -S localhost,1433 -U sa -C -b \
            -d DataWarehouse \
            -i tests/quality_checks_gold.sql

      # 16. Pipeline summary
      - name: Pipeline summary
        if: success()
        run: |
          echo "SQL Server Data Warehouse CI pipeline completed successfully."
          echo "Database: DataWarehouse"
          echo "Layers: Bronze -> Silver -> Gold"
          echo "Silver quality checks: PASSED"
          echo "Gold quality checks: PASSED"